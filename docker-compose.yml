# n8n plus a local Ollama that embeds the FAQ. Start with: docker compose up -d
name: n8n-whatsapp-support

services:
  n8n:
    image: n8nio/n8n:2.45.7
    ports:
      - "${N8N_HOST_PORT:-5678}:5678"
    environment:
      GENERIC_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      # n8n 2.x reads files only under ~/.n8n-files; the ingest workflow reads the FAQ here.
      - ./knowledge:/home/node/.n8n-files/knowledge:ro
      - ./workflows:/workflows:ro
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.40.13
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Downloads the embedding model once (about 270 MB), then exits.
  ollama-pull:
    image: ollama/ollama:0.40.13
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama", "pull", "nomic-embed-text"]
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  n8n_data:
  ollama_models:
